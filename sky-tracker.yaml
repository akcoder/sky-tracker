# Sky Tracker — Guition ESP32-4848S040 (requirements rev 4)
# Files: sky-tracker.yaml, sat_net.h (data task: CelesTrak element sets, propagation),
# sat_tracker.h (scheduling + drawing), sky_math.h (geometry, Sun, Moon), sgp4.h
# (SGP4/SDP4), sky_stars.h (star catalogue). Orbits come from CelesTrak: no API key.

substitutions:
  manifest_url: https://akcoder.github.io/sky-tracker/manifest.json  # UI-68
  fw_version: "4.6.56"      # project version: HA device info and the settings page (bump on every install)
  name: sky-tracker
  friendly_name: Sky Tracker
  observer_lat: "61.581"     # defaults only; the live values are the Observer Latitude /
  observer_lon: "-149.439"  # Longitude entities, editable on the settings page (UI-16)
  observer_alt_m: "100"
  sat_group: "visual"     # DATA-2: CelesTrak GP group for the satellite layer (~160 brightest)
  starlink_radius: "80"   # DATA-3/UI-39: default LEO cone (radius from overhead; 80 = above 10° elevation); the LEO Cone entity sets it (15-90)
  map_heading: "0"        # UI-15: compass direction at the top of the map (0 = north)
  ap_name: Sky Tracker    # the open fallback AP (renamed with the MAC suffix at boot)
  timezone: America/Anchorage  # UI-70: the zone built in, used until Home Assistant sends its own (Auto) or a choice is made
  tracker_common_url: https://github.com/akcoder/tracker-common
  tracker_common_ref: v0.4.6   # a tag, so a change in tracker-common cannot break this build (keep ../tracker-common on it: the host tests use that checkout)
  backlight_min: "0.10"   # HW-6: lowest PWM duty that is still visible; raise if the
                          # panel goes dark at the bottom of the brightness slider
  # HW-8/HW-9: optional GPS and compass (README "Hardware"; compass: docs/wiring_compass.svg)
  gps_rx_pin: "42"        # GPS TX -> GPIO42 (module pin 35); found by the pin scan (RXD0 is
                          # shared with the USB-serial chip, which drowns a GPS out)
  # (the compass's SDA / SCL pins are found at run time among GPIO 1, 2, 40 and 41, HW-9c)
  wifi_name: "your Wi-Fi network"  # shown on the Wi-Fi status page while connecting

esphome:
  name: ${name}
  name_add_mac_suffix: true       # every unit gets its own name
  friendly_name: ${friendly_name}
  project:                       # NET-9: shown in HA's device info
    name: akcoder.sky_tracker
    version: "${fw_version}"
  build_flags:
    # PERF-8: LVGL tracks 32 dirty areas by default and redraws the WHOLE screen when
    # they overflow. Every moving marker dirties two areas, so ~16 moving markers
    # forced a full-screen PSRAM redraw each tick and the panel jumped. ESPHome
    # passes -D flags to every IDF component, LVGL included, so layouts agree.
    - "-DLV_INV_BUF_SIZE=128"
  platformio_options:
    # UI-80: LVGL's QR code for the launch countdown's webcast link. ESPHome's lv_conf.h turns
    # off every LVGL part its widgets don't use, unless a define here (and only here) sets it.
    build_flags:
      - "-DLV_USE_QRCODE=1"
      - "-DLV_USE_SNAPSHOT=1"        # UI-69o: the screen snapshot behind the animations
  on_boot:
    - priority: 1100               # HW-7: before the SPI bus (1000) and the panel init
      then:
        - lambda: |-
            sat::sdfw::boot_probe();             // UI-66: the only look at the card (shares 47/48)
            tracker::panel_soft_reset(39, 48, 47);   // CS, SCK, MOSI of GUITION-4848S040
            // NET-2: fallback AP named "Sky Tracker - XXXX" (last 4 hex digits of the MAC).
            // Set before Wi-Fi starts (setup priority 250); ESPHome's ssid: must be a literal.
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char ssid[33];
            snprintf(ssid, sizeof(ssid), "Sky Tracker - %02X%02X", mac[4], mac[5]);
            auto ap = id(wifi_comp).get_ap();
            ap.set_ssid(ssid);
            id(wifi_comp).set_ap(ap);
    - priority: -200               # UI-68: first update check once the boot downloads are done
      then:                        # (at boot it ran out of memory for a second TLS connection)
        - delay: 3min
        - lambda: sat::upd::check_quiet("boot");
    - priority: 215                # NET-8: SNTP sets up at 220 and would ask for the time before Wi-Fi is up: stopped at once
      then:
        - lambda: sat::sntp_hold();
    - priority: 600                # NET-10: sun tab icon; before web_server's setup (249)
      then:
        - lambda: |-
            tracker::web::install({skyweb::FAVICON_SVG, skyweb::HEADER_SVG, sizeof(skyweb::HEADER_SVG) - 1,
                                   "https://github.com/akcoder/sky-tracker", "Sky Tracker ${fw_version}"});  // NET-10: tab icon, header badge, logo link
            skydiag::install("${fw_version}");  // FAIL-10: before the API takes the crash record
    - priority: -100
      then:
        - lambda: |-
            // BOOT-2: the boot screen (logo, "Loading") on the panel before the slow start-up below;
            // LVGL draws nothing until setup ends, so one frame is forced now; the light writes its
            // restored level only from loop(), after setup, so the backlight is set here too
            sat::logo_show(id(boot_logo), 200);   // UI-65
            sat::logo_meteor(id(boot_logo), 1);   // UI-67a: the shooting star on the boot logo too
            lv_refr_now(nullptr);
            {
              float b = 0.0f;
              id(backlight).current_values_as_brightness(&b);  // HW-3: the restored level, gamma applied
              id(backlight_pwm).set_level(b);
            }
            sat::Config c;
            c.lat = std::isnan(id(obs_lat).state) ? ${observer_lat} : id(obs_lat).state;
            c.lon = std::isnan(id(obs_lon).state) ? ${observer_lon} : id(obs_lon).state;
            c.alt_m = ${observer_alt_m};
            c.sat_group = "${sat_group}";
            c.starlink_radius = std::isnan(id(leo_cone).state) ? ${starlink_radius} : (int) id(leo_cone).state;  // UI-39
            sat::Widgets w;
            w.sky = id(sky_box);
            w.status = id(hdr_status);
            w.counts = id(hdr_counts);
            w.clock = id(hdr_clock);
            w.foot_iss = id(foot_iss);
            w.foot_pass = id(foot_pass);
            w.coords = id(hdr_coords);
            w.alm_sun = id(alm_sun);
            w.alm_moon = id(alm_moon);
            w.alm_phase = id(alm_phase);
            w.moon_img = id(moon_img);
            w.list = id(list_table)->obj;
            w.label_font = id(mono12)->get_lv_font();
            w.title_font = id(mono16)->get_lv_font();
            w.card_font = id(mono14)->get_lv_font();        // UI-24: card body +2 pt
            w.alert_font = id(mono15)->get_lv_font();       // UI-41: alerts, one size
            w.card_title_font = id(mono18)->get_lv_font();  // UI-24: card title +2 pt
            w.icon_font = id(mdi_icon14)->get_lv_font();  // debris trash glyph
            w.card_icon_font = id(mdi_card20)->get_lv_font();  // UI-30: details-card type icon
            w.card_icon_big = id(mdi_card40)->get_lv_font();   // UI-30: the same at 40 px on the card
            sat::sntp_hold();  // NET-8: SNTP waits for Wi-Fi (restarted in wifi on_connect)
            sat::set_heading(id(map_heading).state);  // restored values, applied before drawing
            sat::set_24h(id(clock_24h).state);
            sat::set_miles(id(use_miles).state);
            sat::set_debris(id(show_debris).state);
            sat::set_layers(id(show_satellites).state, id(show_starlink).state, id(show_meo).state, id(show_geo).state);
            sat::set_stars(id(show_stars).state, id(stars_after_dusk).state);
            sat::set_trails(id(show_trails).state);
            sat::set_planets(id(show_planets).state);  // UI-40
            sat::set_milky_way(id(show_milky_way).state);  // UI-64
            sat::set_comets(id(show_comets).state);        // UI-63
            sat::set_alerts(id(aurora_alerts).state, id(planet_alerts).state);  // UI-41a
            sat::set_sky_alerts(id(sky_alerts).state);  // UI-47..51
            sat::set_alert_kinds(id(station_alerts).state, id(launch_alerts).state, id(event_alerts).state);  // UI-41e
            sat::set_stations(id(show_stations).state);  // UI-52b
            sat::set_lunar_alerts(id(lunar_alerts).state);  // UI-41f
            sat::set_solar_alerts(id(solar_alerts).state);  // UI-41k
            sat::set_swx_alerts(id(swx_alerts).state);          // UI-73
            sat::set_reentry_alerts(id(reentry_alerts).state);  // UI-74
            sat::set_history_alerts(id(history_alerts).state);  // UI-77
            sat::set_comet_alerts(id(comet_alerts).state);  // UI-41g
            sat::set_splash_alerts(id(splash_alerts).state);  // UI-41h
            sat::set_night(id(night_mode).state);      // UI-45
            sat::setup(c, w);
            sat::vs::install(id(main_display));  // PERF-14: status-line changes drawn behind the scan
            sat::night_install();
            sat::settings_bind(id(ta_heading), id(ta_lat), id(ta_lon), id(sw_24h), id(settings_status));
            sat::settings_title = id(settings_title);  // UI-16a: names the open tab
            sat::settings_bind_dms(id(sw_dms), id(box_lat_dd), id(box_lat_dms), id(ta_lat_d), id(ta_lat_m),
                                   id(ta_lat_s), id(lat_hemi), id(box_lon_dd), id(box_lon_dms), id(ta_lon_d),
                                   id(ta_lon_m), id(ta_lon_s), id(lon_hemi));
            sat::settings_set_dms(id(coord_dms));
            // HW-9: the compass's saved calibration (its pins and chip are found at run time, HW-9c)
            sat::hw::set_calibration(id(cal_cx), id(cal_cy), id(cal_sx), id(cal_sy), id(cal_ok));
            sat::hw::gps_diag_init(${gps_rx_pin});  // HW-8a: the RX pin's edge counter (the pin is shown in GPS Diagnostic)
            sat::logo_show(id(about_logo), 112);  // UI-67
            sat::logo_meteor(id(about_logo));     // UI-67a
            sat::dino::set_font(id(mono16)->get_lv_font());  // UI-83: the logo's egg
            {
              char d[24], b[64];
              tracker::about::tidy_date(__DATE__, d, sizeof(d));
              snprintf(b, sizeof(b), "ESPHome %s, built %s", ESPHOME_VERSION, d);
              lv_label_set_text(id(about_built), b);
            }
            sat::sdfw::init("${fw_version}", id(setup_title)->get_lv_font(), id(mono16)->get_lv_font(),
                            id(mono12)->get_lv_font());  // UI-66
            // NET-14: the update check and install wait for the data task to go quiet
            // UI-12: an install (the web page's, HA's, the IDE's, GitHub's) pauses the data task, shows the map
            // and puts up the install card; a failed one resumes the data task
            tracker::upd::ota_hook_begin = []() {
              sat::ota_begin();
              id(lvgl_comp)->show_page(id(sky_page)->index, LV_SCREEN_LOAD_ANIM_NONE, 50);
            };
            tracker::upd::ota_hook_error = []() { sat::ota_error(); };
            // UI-44: the package's Backlight number asks us for tonight's brightness factor
            tracker::display::factor_now = []() { return sat::auto_bright_factor(); };
            sat::upd::set_button(id(upd_btn));  // UI-68a: our icon, before init (which would make its own)
            sat::upd::init(id(fw_update), id(setup_title)->get_lv_font(), id(mono16)->get_lv_font(),
                           id(mono12)->get_lv_font());  // UI-68
            sat::upd::set_source("${manifest_url}");  // NET-13a
            sat::rocket::init(id(mono18)->get_lv_font());  // UI-69
            sat::rocket::set_enabled(id(launch_anim).state);
            sat::octo::set_enabled(id(octopus_visits).state);  // UI-85
            sat::rocket::countdown_fonts(id(mono72)->get_lv_font(), id(mono18)->get_lv_font(), id(mono16)->get_lv_font(),
                                         id(mono12)->get_lv_font());  // UI-76
            sat::rocket::set_countdown(id(launch_countdown).state);
            sat::rocket::play_boot();  // UI-69k: a launch over the boot screen (Launch Animation on)
            lv_label_set_text(id(wifi_title), "Connecting to Wi-Fi");  // BOOT-2: start-up done
            sat::tz::init();  // UI-70

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # DATA-10: 4 MB "skydata" partition for the orbital-data cache (two 5.75 MB app
  # slots remain). Changing the table needs one USB flash; OTA can't move partitions.
  partitions:
    - name: skydata
      type: data
      subtype: 0x40
      size: 0x400000
  framework:
    type: esp-idf
    advanced:
      # UI-66: firmware from a microSD card. ESPHome leaves these IDF parts out by default.
      include_builtin_idf_components: [fatfs, sdmmc, esp_driver_sdmmc, wear_levelling]
      disable_vfs_support_dir: false   # opendir/readdir on the card
    sdkconfig_options:
      # UI-66: the image's app descriptor carries the project version (ESPHome puts its own
      # there otherwise), so a card update can read it at a fixed offset
      CONFIG_APP_PROJECT_VER_FROM_CONFIG: y
      CONFIG_APP_PROJECT_VER: '"${fw_version}"'   # (Kconfig strings need their own quotes)
      # UI-66: long file names on the card (sky-tracker-esp32s3.ota.bin)
      CONFIG_FATFS_LFN_HEAP: y
      CONFIG_FATFS_MAX_LFN: "255"
      # PERF-2: re-sync the RGB panel DMA every vblank so a stall can't leave the
      # picture permanently shifted.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      # PERF-10: run code and read-only data from PSRAM (Espressif's recommendation for
      # a PSRAM framebuffer with bounce buffers). Flash and PSRAM share one bus on the
      # S3: flash instruction fetches starved the panel's refills (jitter), and flash
      # writes stalled the cache entirely (shift during uploads). This replaces the
      # need for CONFIG_LCD_RGB_ISR_IRAM_SAFE, which must still NOT be added (PERF-3).
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      # 64-byte cache lines: fewer, larger PSRAM bursts for the bounce-buffer copies.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # PERF-13: 32 KB instruction cache (default 16 KB). Code runs from PSRAM (PERF-10),
      # which the panel scanout keeps busy; each miss costs ~1 us, and LVGL's code doesn't
      # fit in 16 KB (one lv_obj_set_size took ~5 ms in the launch animation). Costs 16 KB of
      # internal RAM.
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      # NET-11: a 16 KB TCP receive window (default 5.7 KB): from Alaska the NOAA and NASA
      # servers are ~100 ms away and a download can't run faster than window / round trip.
      # lwIP and Wi-Fi buffers MUST come from PSRAM (PERF-12): in internal RAM (4.5.35) they
      # left ~20 KB free and downloads failed ("Failed to allocate memory").
      CONFIG_LWIP_TCP_WND_DEFAULT: "16384"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "16"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      # UI-68: all mbedTLS memory from PSRAM. From internal RAM, the update check's second TLS
      # session (sat_net keeps one open) failed every time: "mbedtls_ssl_setup returned
      # -0x7F00" (out of memory). Going through malloc (4.6.4) was not enough.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      # NET-16: malloc of more than 4 KB comes from PSRAM (default 16 KB). The HTTP client's own 8 KB receive buffer
      # went to internal RAM (~44 KB free, largest block ~31 KB) and a download failed on unit A: "Failed to allocate
      # memory for storing decoded data", read failed after 0 bytes, "download was cut short". (Explicit
      # heap_caps_malloc(INTERNAL) calls, such as the LVGL draw buffer and DMA, are unaffected.)
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"

# tracker-common (shared with f1-tracker): the board (panel, touch, backlight, Wi-Fi, time, OTA cards).
# backlight.yaml: the brightness globals, the Backlight number, the Auto Brightness switch, the light's slider sync,
# the touch wake.
# NOT taken: its sdkconfig file (our memory and network tuning stays as it is below), BLE Improv, and its
# diagnostics (our entity names and web order differ).
packages:
  tracker_board:
    url: ${tracker_common_url}
    ref: ${tracker_common_ref}
    files: [boards/guition-4848s040.yaml, boards/backlight.yaml]
    refresh: 1d

# UI-70: the time zone is the `timezone` substitution above, passed to the package's two time sources. It is only the
# zone before Home Assistant's first sync: HA (2026.3+) sets the device's zone with every sync whatever the YAML says
# (api_connection.cpp, on_get_time_response), and a chosen zone is put back by sky_tz.h. Do not `!remove` it: ESPHome
# then bakes in the BUILD HOST's zone (time/__init__.py detect_tz), UTC on GitHub Actions and Alaska on a Mac here.

# PERF-18: the console is UART0 (the board package's). A log line is written to it with a blocking call through a
# 512-byte buffer: at the default 115200 baud a 100-byte line holds the calling task for ~9 ms, so a burst of
# logging when a screen opens stalls the screen.
# 230400: twice the default, and a rate the USB-serial chip and macOS agree on (921600 and 1 Mbaud came out as garbage).
logger:
  baud_rate: 230400
  # PERF-23: INFO, not DEBUG. At boot DEBUG printed ~600 lines (the display's init commands, ESPHome's configuration dump):
  # each is a blocking write to the serial port, ~1.5 s in which the main loop could not draw the loading screen.
  # (A tag cannot be more verbose than the global level, so the debug lines of ours that matter are INFO lines.)
  level: INFO

# BUILD-7: the C++ (headers, sky_extra.cpp, build flags) is the sky_tracker external component
external_components:
  - source:
      type: git
      url: https://github.com/akcoder/sky-tracker
      ref: main
    components: [sky_tracker]
  - source:                    # the pieces shared with f1-tracker; a tag, so a change there cannot break this build
      type: git
      url: ${tracker_common_url}
      ref: ${tracker_common_ref}
    components: [tracker_common]
    refresh: 1d
sky_tracker:
tracker_common:

# Made for ESPHome: adopt into your own ESPHome Builder from this file, and set up Wi-Fi
# over USB with Improv (https://www.improv-wifi.com) or from the fallback access point.
dashboard_import:
  package_import_url: github://akcoder/sky-tracker/sky-tracker.yaml@main
  import_full_config: true

# PERF-20: the unit takes a command over the network, from tools/dbg.py (the API's log stream is its answer): open a
# picture, change page, print the screen-drawing numbers. Nothing here shows in Home Assistant but an action.
api:
  actions:
    - action: debug_cmd
      variables:
        cmd: string
      then:
        - lambda: |-
            ESP_LOGI("dbg", "command: %s", cmd.c_str());
            if (strcmp(cmd.c_str(), "perf") && strcmp(cmd.c_str(), "state") && strcmp(cmd.c_str(), "reset"))
              lv_display_trigger_activity(nullptr);  // (a command counts as a touch: the one-minute idle close would shut what it opened)
            if (!strncmp(cmd.c_str(), "page ", 5)) {
              const char *p = cmd.c_str() + 5;
              auto go = [&](int idx) { id(lvgl_comp)->show_page(idx, LV_SCREEN_LOAD_ANIM_NONE, 0); };
              if (!strcmp(p, "sky")) go(id(sky_page)->index);
              else if (!strcmp(p, "list")) go(id(list_page)->index);
              else if (!strcmp(p, "settings")) go(id(settings_page)->index);
              else if (!strcmp(p, "about")) go(id(about_page)->index);
              else if (!strcmp(p, "debug")) go(id(debug_page)->index);
              else ESP_LOGW("dbg", "page what? (sky list settings about debug)");
            } else {
              sat::dbg::run(cmd.c_str());
            }

wifi:
  id: wifi_comp
  # NET-2: the board package's open fallback AP (named by ap_name, renamed with the MAC suffix at boot, started
  # 30 s after Wi-Fi fails) and reboot_timeout 0s: never reboot away from the AP while someone is configuring
  on_connect:                    # NET-7: ask for the time as soon as there is a network
    - lambda: |-
        sat::sntp_kick();
        sat::dns_check("connected");  // NET-15
  on_disconnect:                 # NET-8: no network calls while Wi-Fi is down
    - lambda: sat::sntp_hold();

web_server:                      # NET-1: built-in web UI on port 80
  port: 80
  version: 3
  local: true                    # bundle the UI so it also works on the AP (no internet)
  include_internal: true         # UI-87: the eclipse buttons are web-only (internal: not in the API or Home Assistant)
                                 # NET-1: firmware upload from the web page is ON
  sorting_groups:                # NET-6: sections on the web page (HA is unaffected)
    - id: grp_location           # the observer's place and the compass (the Settings > Location tab)
      name: Location
      sorting_weight: 5
    - id: grp_sky                # order: Location, Sky, Satellites, Celestial, Alerts, Display, ISS, System
      name: Sky                  # (the OTA upload form is always last)
      sorting_weight: 10
    - id: grp_sats
      name: Satellites
      sorting_weight: 20
    - id: grp_celestial            # NET-6: stars, trails, planets (4.5.2)
      name: Celestial
      sorting_weight: 25
    - id: grp_alerts             # NET-6a: the status-line alert switches, in the Alerts tab's order
      name: Alerts
      sorting_weight: 27
    - id: grp_display
      name: Display
      sorting_weight: 30
    - id: grp_animations         # the "Play ... Animation" buttons
      name: Animations
      sorting_weight: 35
    - id: grp_iss
      name: ISS
      sorting_weight: 40
    - id: grp_system
      name: System
      sorting_weight: 50

# UI-68: internet updates. GitHub Actions builds every release and publishes the firmware
# and its manifest on GitHub Pages; the device checks every hour, on Settings > Upgrade Check
# and on the Upgrade Check button (web UI, HA).
update:
  - platform: http_request
    id: fw_update
    name: Firmware
    icon: mdi:update
    source: ${manifest_url}
    update_interval: never         # NET-13a: checked from the interval below, so each check is logged
    web_server:
      sorting_group_id: grp_system

# ------------------------------------------------------------------ hardware
touchscreen:
  - id: !extend touch
    update_interval: 16ms          # UI-86: the GT911 was read every 50 ms (the default) against LVGL's 16 ms: most reads moved 0 px, a swipe lost its speed

# (i2c: bus_a, the touch, is the board package's; the compass's own bus is made at run time, HW-9c)

uart:                            # HW-8: optional GPS, receive only (NMEA, 9600 baud)
  id: gps_uart
  rx_pin:
    number: ${gps_rx_pin}
    mode:
      input: true
      pullup: true               # idle high when no GPS is fitted
  baud_rate: 9600
  rx_buffer_size: 1024

font:
  - file: "gfonts://Roboto Mono"
    id: mono12
    size: 12
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: &glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz|~°·±"
  - file: "gfonts://Roboto Mono"
    id: mono16
    size: 16
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono14                   # UI-24: details card body (2 pt over mono12)
    size: 14
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono15                   # UI-41: status-line alerts (1 pt over mono14)
    size: 15
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono18                   # UI-24: details card title (2 pt over mono16)
    size: 18
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono@500"
    id: mono24
    size: 24
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: " -0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ"  # clock ("--:--" before time sync), AM/PM, OTA panel title
  - file: "gfonts://Roboto Mono@500"
