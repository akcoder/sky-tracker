        - lvgl.page.next:
            animation: FADE_IN
            time: 200ms
      widgets:
        - table:                 # UI-10: columns and row colours set in sat::list_build / draw_list
            id: list_table
            x: 10
            y: 8
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: false
            items:
              text_font: mono12
