            text_font: mono16
            text_color: 0xDCE4F8
            long_mode: WRAP
        - button:
            id: btn_dbg_prev
            x: 8
            y: 424
            width: 110
            height: 44
            bg_color: 0x1A2547
            shadow_width: 0
            widgets:
