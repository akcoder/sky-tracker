globals:
  - id: coord_dms                # UI-16: coordinate entry format (false = decimal, true = DMS)
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cal_cx                   # HW-9: compass calibration (hard-iron centre, soft-iron scale)
    type: float
    restore_value: true
    initial_value: "0"
  - id: cal_cy
    type: float
    restore_value: true
    initial_value: "0"
  - id: cal_sx
    type: float
    restore_value: true
    initial_value: "1"
  - id: cal_sy
    type: float
    restore_value: true
    initial_value: "1"
  - id: cal_ok
    type: bool
    restore_value: true
    initial_value: "false"

interval:
  - interval: 60s                # NET-15: the DNS servers held (a DHCP renewal can drop them)
    then:
      - lambda: sat::dns_check("periodic");
  - interval: 1h                 # UI-68: hourly firmware check (logged, NET-13a)
    then:
      - lambda: sat::upd::check_quiet("hourly");
  - interval: 200ms              # HW-9: compass at 5 Hz
    id: interval_1
    then:
      - lambda: |-
          if (sat::hw::compass_poll(esphome::millis())) {  // a calibration run just ended
            auto c = sat::hw::calibrate_finish();
            if (c.valid) {
              id(cal_cx) = c.cx; id(cal_cy) = c.cy; id(cal_sx) = c.sx; id(cal_sy) = c.sy; id(cal_ok) = true;
              sat::show_notice("Compass calibrated", 8);
            } else {
              sat::show_notice("Compass calibration failed: turn the display a full circle", 12);
            }
            sat::hw::cal_screen_result(c.valid);  // HW-9b
          }
          sat::hw::cal_screen_update(esphome::millis());
          if (sat::finder_open()) {  // UI-57: the arrow follows the compass at 5 Hz
            const float mag = sat::hw::magnetic_heading(id(compass_reverse).state);
            sat::finder_update(std::isnan(mag) ? NAN
                               : sat::hw::wrap360(mag + sat::declination() + id(compass_offset).state));
          }
  - interval: 30s                # UI-44: auto brightness follows the Sun
    id: interval_2
    then:
      - lambda: |-
          if (!id(auto_bright).state || id(settings_page)->is_showing() || !id(backlight).current_values.is_on()) return;
          const float want = std::max(0.01f, id(bright_day) * sat::auto_bright_factor());
          if (fabsf(id(backlight).current_values.get_brightness() - want) < 0.01f) return;
          auto call = id(backlight).turn_on();
          call.set_brightness(want);
          call.set_transition_length(3000);
          call.perform();
  - interval: 1s                 # UI-27: debug pages, only while one is showing
    id: interval_4
    then:
      - lambda: |-
          if (id(debug_page)->is_showing()) {  // page 1: system, orbital data, last crash
            static char b[1800];
            const uint32_t s = esphome::millis() / 1000;
            char up[24];
            sat::fmt_dur((double) s, up, sizeof(up));  // UI-17a
            const std::string ip = id(ip_addr).state, ssid = id(wifi_ssid_info).state;
            int k = snprintf(b, sizeof(b),
                             "SYSTEM\n  IP %s\n  Wi-Fi %s  %d dBm\n  Firmware %s  ESPHome %s\n"
                             "  Up %s  RAM %u kB  PSRAM %u kB free\n",
                             ip.empty() ? "-" : ip.c_str(), ssid.empty() ? "-" : ssid.c_str(),
                             (int) id(wifi_comp).wifi_rssi(), "${fw_version}", ESPHOME_VERSION,
                             up,
                             (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                             (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
            char orb[400];  // UI-27: age of the orbital data
            sat::orbital_debug(orb, sizeof(orb), sat::clock_now());
            char diag[600];  // FAIL-10: reset reason and the last crash
            skydiag::debug_text(diag, sizeof(diag));
            if (k < (int) sizeof(b)) snprintf(b + k, sizeof(b) - k, "%s\n%s", orb, diag);
            lv_label_set_text(id(debug_label), b);
          } else if (id(about_page)->is_showing()) {  // UI-67
            static char b[200];
            const std::string ip = id(ip_addr).state, ssid = id(wifi_ssid_info).state;
            tracker::about::device_text(b, sizeof(b), App.get_name().c_str(), ip.c_str(), ssid.c_str(),
                                   (int) id(wifi_comp).wifi_rssi(), get_mac_address_pretty().c_str(),
                                   esphome::millis() / 1000.0);
            if (strcmp(lv_label_get_text(id(about_dev)), b) != 0) lv_label_set_text(id(about_dev), b);
          } else if (id(debug2_page)->is_showing()) {  // page 2: GPS and compass
            static char b[1400];
            sat::hw::debug_text(b, sizeof(b), esphome::millis(), 2);  // the 2 newest NMEA lines
            lv_label_set_text(id(debug2_label), b);
            const bool can = sat::hw::compass_present();  // HW-9b: no compass, no button
            if (can == lv_obj_has_state(id(btn_dbg_cal), LV_STATE_DISABLED)) {
              if (can) lv_obj_remove_state(id(btn_dbg_cal), LV_STATE_DISABLED);
              else lv_obj_add_state(id(btn_dbg_cal), LV_STATE_DISABLED);
              lv_obj_set_style_text_color(id(lbl_btn_dbg_cal), lv_color_hex(can ? 0xEEF2FF : 0x4A5577), 0);
            }
          }
  - interval: 50ms               # HW-8: drain the GPS UART into the NMEA reader
    id: interval_5
    then:
      - lambda: |-
          const uint32_t now = esphome::millis();
          uint8_t c;
          int n = 0;
          while (n++ < 512 && id(gps_uart).available() && id(gps_uart).read_byte(&c))
            sat::hw::nmea_feed(c, now);
  - interval: 1s                 # HW-8/HW-9: GPS location and compass heading
    id: interval_6
    then:
      - lambda: |-
          // ---- GPS
          const auto &m = sat::hw::nmea;
          const bool valid = sat::hw::nmea_fix_ok(esphome::millis());
          sat::hw::gps_update(esphome::millis(), m.chars, valid, m.lat, m.lon, m.alt, m.sats_used < 0 ? 0 : m.sats_used);
          {  // HW-8 diagnostics: bytes, checksums; steps the baud rate if needed
            const uint32_t nb = sat::hw::gps_diag_tick(esphome::millis(), m.chars, m.passed, m.failed);
            if (nb) {
              id(gps_uart).set_baud_rate(nb);
              id(gps_uart).load_settings(false);
            }
            // (the GPS diagnostic line that was logged here every 10 s is gone)
          }
          double lat, lon;
          if (sat::hw::gps_new_position(id(obs_lat).state, id(obs_lon).state, lat, lon)) {
            id(obs_lat).make_call().set_value(lat).perform();   // saved, so a reboot starts here
            id(obs_lon).make_call().set_value(lon).perform();
          } else if (sat::hw::gps_locked() && sat::hw::gps.applied) {
            // undo edits made from HA or the web page while the GPS owns the location
            if (fabs(id(obs_lat).state - sat::hw::gps.applied_lat) > 1e-6) id(obs_lat).publish_state(sat::hw::gps.applied_lat);
            if (fabs(id(obs_lon).state - sat::hw::gps.applied_lon) > 1e-6) id(obs_lon).publish_state(sat::hw::gps.applied_lon);
          }
          // ---- compass
          const float mag = sat::hw::magnetic_heading(id(compass_reverse).state);
          if (!std::isnan(mag)) {
            // HW-9a: declination from the location (WMM2025), not a fixed setting
            const float h = sat::hw::wrap360(mag + sat::declination() + id(compass_offset).state);
            const float cur = id(map_heading).state;
            const float diff = (std::isnan(sat::hw::head_pub) || std::isnan(cur)) ? 360.0f : sat::hw::angle_diff(h, cur);
            if (sat::heading_update_due(diff, esphome::millis() - sat::head_last_ms, lv_display_get_inactive_time(nullptr))) {  // UI-15a
              sat::head_last_ms = esphome::millis();
              sat::hw::head_pub = roundf(h) >= 360 ? 0 : roundf(h);
              id(map_heading).publish_state(sat::hw::head_pub);   // not saved: no flash wear
            }
          }
          if (sat::hw::compass_calibrating()) {
            char b[120];
            const int left = (int) ((int32_t) (sat::hw::compass.cal_end_ms - esphome::millis()) / 1000);
            char ls[16];
            sat::fmt_dur(left > 0 ? left : 0, ls, sizeof(ls));  // UI-17a
            snprintf(b, sizeof(b), "Compass calibration: turn the display slowly\nthrough a full circle (%s)", ls);
            sat::show_notice(b, 3);
          }
          {  // HW-9a: the settings button shows the run and the result
            char lb[24], st[24];
            if (sat::hw::compass_calibrating()) {
              const int left = (int) ((int32_t) (sat::hw::compass.cal_end_ms - esphome::millis()) / 1000);
              char ls[16];
              sat::fmt_dur(left > 0 ? left : 0, ls, sizeof(ls));  // UI-17a
              snprintf(lb, sizeof(lb), "Turn... %s", ls);
              snprintf(st, sizeof(st), "%s", "turn slowly");
            } else {
              snprintf(lb, sizeof(lb), "%s", "Calibrate");
              snprintf(st, sizeof(st), "%s", !sat::hw::compass_present() ? "no compass"
                                             : sat::hw::compass_calibrated() ? "calibrated" : "not calibrated");
            }
            if (strcmp(lv_label_get_text(id(lbl_cal)), lb) != 0) lv_label_set_text(id(lbl_cal), lb);
            if (strcmp(lv_label_get_text(id(lbl_cal_state)), st) != 0) lv_label_set_text(id(lbl_cal_state), st);
            const bool can = sat::hw::compass_present();  // HW-9b: no compass, no button
            if (can == lv_obj_has_state(id(btn_cal), LV_STATE_DISABLED)) {
              if (can) lv_obj_remove_state(id(btn_cal), LV_STATE_DISABLED);
              else lv_obj_add_state(id(btn_cal), LV_STATE_DISABLED);
              sat::field_enable(id(ta_offset), can);  // HW-9c
              lv_obj_set_style_text_color(id(lbl_cal), lv_color_hex(can ? 0xEEF2FF : 0x4A5577), 0);
            }
          }
          sat::set_locks(sat::hw::gps_locked(), sat::hw::heading_locked());
          // ---- boot / Wi-Fi status page: say which add-ons are connected
          if (id(wifi_page)->is_showing()) {
            char hw[96], g[48], c[48];
            const auto &gs = sat::hw::gps;
            if (gs.state == sat::hw::GPS_FIX)
              snprintf(g, sizeof(g), "GPS: connected, fix (%d sat)", gs.sats);
            else if (gs.state == sat::hw::GPS_SEARCHING)
              snprintf(g, sizeof(g), "GPS: connected, searching");
            else
              snprintf(g, sizeof(g), "GPS: not connected");
            if (sat::hw::compass_present())
              snprintf(c, sizeof(c), "Compass: connected (%s)", sat::hw::compass_chip());
            else
              snprintf(c, sizeof(c), "Compass: not connected");
            snprintf(hw, sizeof(hw), "%s\n%s", g, c);
            if (strcmp(lv_label_get_text(id(wifi_hw)), hw) != 0) lv_label_set_text(id(wifi_hw), hw);
          }
          // ---- HA text
          char src[48];
          if (sat::hw::gps_locked())
            snprintf(src, sizeof(src), "GPS (%d satellites)", sat::hw::gps.sats);
          else if (sat::hw::gps.state != sat::hw::GPS_ABSENT)
            snprintf(src, sizeof(src), "Manual; GPS searching (%d satellites)", sat::hw::gps.sats);
          else
            snprintf(src, sizeof(src), "Manual");
          if (id(location_source).state != src) id(location_source).publish_state(src);
          if (sat::hw::heading_locked())
            snprintf(src, sizeof(src), "Compass (%s%s)", sat::hw::compass_chip(), sat::hw::compass_calibrated() ? "" : ", not calibrated");
          else
            snprintf(src, sizeof(src), "Manual");
          if (id(heading_source).state != src) id(heading_source).publish_state(src);
  - interval: 2s                 # motion tick (MOTION-7), drain, HUD
    id: interval_7
    then:
      - lambda: sat::tick();
      - lambda: |-
          // UI-72 (when the Auto Close switch is on, UI-72a): a minute untouched closes whatever is open and goes back to the map: Settings
          // as Cancel (nothing saved), the other pages, and what is open over the map. Not the
          // boot / Wi-Fi page, an animation, or an install in progress.
          if (id(auto_close).state && lv_display_get_inactive_time(nullptr) >= 60000 && !sat::rocket::active() && !id(wifi_page)->is_showing()) {
            if (id(settings_page)->is_showing())
              lv_obj_send_event(id(btn_settings_cancel), LV_EVENT_CLICKED, nullptr);
            else if (id(list_page)->is_showing() || id(debug_page)->is_showing() || id(debug2_page)->is_showing() ||
                     id(about_page)->is_showing())
              id(lvgl_comp)->show_page(id(sky_page)->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
            sat::idle_close();
            sat::upd::idle_close();
            sat::sdfw::idle_close();
          }
      - lambda: |-
          // NET-2b: Wi-Fi status page (layout modelled on espcontrol's boot screen).
          // The map is not shown until Wi-Fi connects; after that, 10 s without Wi-Fi
          // brings the status page back (never over the settings page).
          // The decision (tracker-common's tracker::boot, shared with f1-tracker): the link, when the
          // status page comes back, the title and body text.
          static tracker::boot::Tracker bt;
          const auto link = tracker::boot::classify(id(wifi_comp).is_connected(), id(wifi_comp).is_ap_active());
          const bool on_status = id(wifi_page)->is_showing();
          const auto st = tracker::boot::step(bt, link, esphome::millis(), on_status, id(settings_page)->is_showing(), true);
          if (st.page == tracker::boot::TO_RACE)
            id(lvgl_comp)->show_page(id(sky_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300);
          else if (st.page == tracker::boot::TO_STATUS)
            id(lvgl_comp)->show_page(id(wifi_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300);
          if (link != tracker::boot::CONNECTED) {
            char b[128];
            if (link == tracker::boot::CONNECTING) {  // NET-2c: the network it is trying (saved in flash or built in)
              const auto sta_entry = id(wifi_comp).get_sta();  // a WiFiAP by value: its SSID is a StringRef into it,
              const auto ssid = sta_entry.get_ssid();          // so the copy must outlive the use (it dangled, 2026.9)
              char sta[40];
              snprintf(sta, sizeof(sta), "%.*s", (int) ssid.size(), ssid.c_str());
              tracker::boot::body_for(link, sta[0] ? sta : "${wifi_name}", "", b, sizeof(b));
            } else {
              const auto ap_entry = id(wifi_comp).get_ap();
              const auto ap = ap_entry.get_ssid();
              tracker::boot::body_for(link, "", ap.c_str(), b, sizeof(b));
            }
            if (st.link_changed)
              lv_label_set_text(id(wifi_title), tracker::boot::title_for(link));
            if (strcmp(lv_label_get_text(id(wifi_body)), b) != 0)
              lv_label_set_text(id(wifi_body), b);
          }

# ------------------------------------------------------------------ Home Assistant (ARCH-9)
sensor:
  - platform: template           # PERF-16: frames whose start was put right (the 10-row shift with noise)
    id: s_display_resyncs
    name: Display Resyncs
    entity_category: diagnostic
    icon: mdi:monitor-shimmer
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: return (float) sat::vs::resyncs;
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 14
  - platform: template           # HW-9a: magnetic -> true north, computed (WMM2025) for the location
    id: s_magnetic_declination
    name: Magnetic Declination
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 9
    icon: mdi:magnet
    entity_category: diagnostic
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 300s
    lambda: return sat::declination();
  - platform: template           # UI-37: planetary Kp from NOAA SWPC (latest 3-hour value)
    id: s_aurora_kp
    name: Aurora Kp
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 12
    icon: mdi:aurora
    accuracy_decimals: 1
    update_interval: 300s
    lambda: return sat::kp_now();
  - platform: template           # UI-55: solar wind at L1 (NOAA SWPC real-time), 15-minute means
    id: s_solar_wind_bz
    name: Solar Wind Bz
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 16
    icon: mdi:magnet
    unit_of_measurement: nT
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 300s
    lambda: return sat::wind_bz();
  - platform: template
    id: s_solar_wind_speed
    name: Solar Wind Speed
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 17
    icon: mdi:weather-windy
    unit_of_measurement: km/s
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 300s
    lambda: return sat::wind_speed();
  - platform: template           # UI-58: NOAA OVATION nowcast, chance of visible aurora overhead
    id: s_aurora_chance
    name: Aurora Chance
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 19
    icon: mdi:aurora
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 300s
    lambda: return sat::aurora_chance();
  - platform: template           # UI-58: the most within ~800 km (seen low in the sky)
    id: s_aurora_chance_in_view
    name: Aurora Chance In View
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 20
    icon: mdi:aurora
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 300s
    lambda: return sat::aurora_chance_view();
  - platform: template
    id: s_iss_elevation
    name: ISS Elevation
    web_server:
      sorting_group_id: grp_iss
      sorting_weight: 1
    icon: mdi:angle-acute
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: return sat::iss_el();
  - platform: template
    id: s_iss_azimuth
    name: ISS Azimuth
    web_server:
      sorting_group_id: grp_iss
      sorting_weight: 2
    icon: mdi:sun-compass
    unit_of_measurement: "°"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return sat::iss_az();
  - platform: template
    id: s_satellites_overhead
    name: Satellites Overhead
    web_server:
      sorting_group_id: grp_sats
      sorting_weight: 3
    icon: mdi:counter
    state_class: measurement     # HA shows "18", not "18.0" (it applies the precision to measurements)
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return sat::sat_count();
  - platform: template
    id: s_starlink_overhead
    name: Starlink Overhead
    web_server:
      sorting_group_id: grp_sats
      sorting_weight: 4
    icon: mdi:counter
    state_class: measurement     # HA shows "18", not "18.0" (it applies the precision to measurements)
    accuracy_decimals: 0
    update_interval: 90s
    lambda: return sat::starlink_count();
  # NET-9 diagnostics (entity_category diagnostic: HA's device page, System group on the web)
  - platform: uptime
    id: s_uptime
    name: Uptime
