            width: 46
            height: 46
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\uF013"   # LV_SYMBOL_SETTINGS
                  text_font: montserrat_28
