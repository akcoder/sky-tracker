    - id: settings_page          # UI-16
      skip: true                 # never reached by tap-to-flip
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_load:
        - lambda: |-
            sat::settings_fill();
            id(bright_on_open) = id(backlight).current_values.get_brightness();
            id(bright_day_open) = id(bright_day);
        - lvgl.slider.update:
            id: sl_bright
            value: !lambda |-
              // UI-44: with auto brightness the slider is the daytime level
              return (int) roundf((id(auto_bright).state ? id(bright_day) : id(bright_on_open)) * 100.0f);
        - lvgl.keyboard.update:
            id: settings_kb
            textarea: ta_heading
        - lvgl.widget.hide: settings_kb   # shown when a text field is tapped
        - lambda: |-
            auto set = [](lv_obj_t *o, bool on) {
              if (on) lv_obj_add_state(o, LV_STATE_CHECKED); else lv_obj_remove_state(o, LV_STATE_CHECKED);
            };
            set(id(sw_sats), id(show_satellites).state);
            set(id(sw_starlink), id(show_starlink).state);
            set(id(sw_meo), id(show_meo).state);
            set(id(sw_geo), id(show_geo).state);
            set(id(sw_stars), id(show_stars).state);
            set(id(sw_dusk), id(stars_after_dusk).state);
            set(id(sw_trails), id(show_trails).state);
            set(id(sw_miles), id(use_miles).state);
            set(id(sw_debris), id(show_debris).state);
            set(id(sw_planets), id(show_planets).state);  // UI-40
            set(id(sw_autob), id(auto_bright).state);     // UI-44
            set(id(sw_night), id(night_mode).state);      // UI-45
            sat::settings_planet_icon(id(pnl_celestial), 122, 244);
            set(id(sw_aur_alerts), id(aurora_alerts).state);  // UI-41a
            set(id(sw_pl_alerts), id(planet_alerts).state);
            set(id(sw_sky_alerts), id(sky_alerts).state);  // UI-47..51
            set(id(sw_milky_way), id(show_milky_way).state);  // UI-64
            set(id(sw_comets), id(show_comets).state);        // UI-63
            // UI-39: cone slider from the entity; UI-16a: open on General
            lv_slider_set_value(id(sl_cone), (int) id(leo_cone).state, LV_ANIM_OFF);
            sat::cone_label(id(lbl_cone), (int) id(leo_cone).state);
            sat::settings_tab(0, id(pnl_display), id(pnl_location), id(pnl_celestial), id(tab_display), id(tab_location), id(tab_celestial));
            // Starlink is part of LEO: editable only while LEO is on
            if (id(show_satellites).state) lv_obj_remove_state(id(sw_starlink), LV_STATE_DISABLED);
            else lv_obj_add_state(id(sw_starlink), LV_STATE_DISABLED);
            if (id(show_satellites).state) lv_obj_remove_state(id(lbl_starlink), LV_STATE_DISABLED);
            else lv_obj_add_state(id(lbl_starlink), LV_STATE_DISABLED);
            if (id(show_satellites).state) lv_obj_remove_state(id(ico_starlink), LV_STATE_DISABLED);
            else lv_obj_add_state(id(ico_starlink), LV_STATE_DISABLED);
      widgets:
        - label:
            x: 16
            y: 16
            text: "SETTINGS"
            text_font: mono16
            text_color: 0xFF8A1F
