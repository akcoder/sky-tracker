number:
  - platform: template           # UI-39: LEO cone, degrees from overhead (the Starlink layer)
    id: leo_cone
    name: LEO Cone
    icon: mdi:angle-acute
    unit_of_measurement: "°"
    min_value: 15
    max_value: 90
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${starlink_radius}
    web_server:
      sorting_group_id: grp_sats
      sorting_weight: 0
    on_value:
      - lambda: sat::set_starlink_radius((int) x);
  - platform: template           # HW-6: brightness as 1-100 % (the light itself is internal)
    id: backlight_pct
    name: Backlight
    icon: mdi:brightness-percent
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 1
    set_action:
      - lambda: |-
          float v = x / 100.0f;
          if (id(auto_bright).state) {  // UI-44: sets the daytime level
            id(bright_day) = v;
            v = std::max(0.01f, v * sat::auto_bright_factor());
          }
          auto call = id(backlight).turn_on();
          call.set_brightness(v);
          call.perform();
  - platform: template           # UI-15: rotate the map from Home Assistant
    id: map_heading
    name: Map Heading
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 3
    icon: mdi:compass-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 359
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${map_heading}
    on_value:
      - lambda: |-
          if (!sat::hw::head_edit_allowed(x)) {  // HW-9: the compass owns the heading
            ESP_LOGW("sky_hw", "Map Heading is set by the compass; change ignored");
            id(map_heading).publish_state(sat::hw::head_pub);
            return;
          }
          sat::set_heading(x);

  - platform: template           # UI-16: observer, editable here or on the settings page
    id: obs_lat
    name: Observer Latitude
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 1
    icon: mdi:latitude
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${observer_lat}
    on_value:
      - lambda: |-
          if (sat::hw::gps_locked() && sat::hw::gps.applied && fabs(x - sat::hw::gps.applied_lat) > 1e-6) {
            ESP_LOGW("sky_hw", "Observer Latitude is set by the GPS; change ignored");
            return;  // HW-8: put back by the 1 s interval
          }
          sat::set_observer(id(obs_lat).state, id(obs_lon).state);
  - platform: template
    id: obs_lon
    name: Observer Longitude
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 2
    icon: mdi:longitude
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${observer_lon}
    on_value:
      - lambda: |-
          if (sat::hw::gps_locked() && sat::hw::gps.applied && fabs(x - sat::hw::gps.applied_lon) > 1e-6) {
            ESP_LOGW("sky_hw", "Observer Longitude is set by the GPS; change ignored");
            return;
          }
          sat::set_observer(id(obs_lat).state, id(obs_lon).state);

  - platform: template           # HW-9: added to the compass reading (mounting angle)
    id: compass_offset
    name: Compass Offset
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 10
    icon: mdi:compass-rose
    entity_category: config
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

switch:
  - platform: template           # HW-9: map turns the wrong way when the display is turned
    id: compass_reverse
    name: Compass Reverse
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 12
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template           # UI-17
    id: clock_24h
    name: 24-hour Clock
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 2
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # default = Dan's setting (2026-09-25)
    on_turn_on:
      - lambda: sat::set_24h(true);
    on_turn_off:
      - lambda: sat::set_24h(false);
  - platform: template           # UI-29: heights, ranges and speeds in miles
    id: use_miles
    name: Distances in Miles
