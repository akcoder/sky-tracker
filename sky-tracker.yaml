      name: Wi-Fi Network
      icon: mdi:access-point-network
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 12

# ------------------------------------------------------------------ LVGL
lvgl:
  id: lvgl_comp
  displays: main_display
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1000ms    # UI-27: hold the gear 1 s for the debug page
  # PERF-4: 12.5% (57.6 KB) asks for internal RAM first (falls back to PSRAM; the
  # 20 s boot diagnostic logs which). LVGL then blends in SRAM and only the finished
  # pixels cross to the PSRAM framebuffer, which leaves the PSRAM bus to the panel's
  # bounce-buffer refills (their starvation is the vsync shift / garbage lines).
  buffer_size: 12.5%
  log_level: WARN
  bg_color: 0x000000
  text_color: 0xC9D3F2
  text_font: mono16
  pages:
    - id: wifi_page              # NET-2b: first page, so it is what boots; skipped by page flips
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            align: CENTER
            width: 380
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_row: 6
            widgets:
              - obj:                     # UI-65: the logo, 200 px (sat::logo_show at boot)
                  id: boot_logo
                  width: 200
                  height: 200
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
              - label:
                  id: boot_name
                  text: "Sky Tracker"
                  text_font: setup_title
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
                  pad_top: 10
                  pad_bottom: 8
              - label:
                  id: wifi_title
                  text: "Loading"            # BOOT-2: until start-up ends; then the Wi-Fi status
                  text_font: setup_body
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
              - label:
                  id: wifi_body
                  text: ""                # NET-2c: the SSID being tried, set by the status lambda
                  text_font: setup_body
                  text_color: 0xB0B0B0
                  width: 380
                  text_align: CENTER
                  pad_bottom: 18
              - label:               # HW-8/HW-9: which add-on sensors were found
                  id: wifi_hw
                  text: "GPS: checking...\nCompass: checking..."
                  text_font: mono16
                  text_color: 0x7E8BB3
                  width: 380
                  text_align: CENTER
        - label:                     # NET-2b: firmware version, lower right (as on settings)
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            text: "v${fw_version}"
            text_font: mono12
            text_color: 0x5A6687
    - id: sky_page               # UI-1
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:                  # UI-2: tap anywhere except the gear flips pages
        - if:                    # UI-24: with the details card up, a tap only closes it
            condition:
              lambda: return sat::card_open();
            then:
              - lambda: sat::deselect();
            else:
              - lvgl.page.next:
                  animation: FADE_IN
                  time: 200ms
      widgets:
        - label:
            x: 10
            y: 4
            text: "Sky Tracker"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:                 # UI-23: observer position, between the title and the clock
            id: hdr_coords
            align: TOP_MID
            y: 4                 # same line as the title
            text: ""
            text_font: mono16
            text_color: 0x7E8BB3
        - label:                 # UI-25 data status / errors (width and wrap set in sat::setup)
            id: hdr_status
            x: 10
            y: 27                # UI-38: 3 px clear of the title (the aurora icon sits above the text)
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:
            id: hdr_counts
            align: TOP_RIGHT
            x: -10
            y: 31
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
            text_align: RIGHT
        - label:
            id: hdr_clock
            align: TOP_RIGHT
            x: -10
            y: 1                 # digit tops (8 px into a mono24 line) level with the title's capitals (5 px into mono16 at y 4)
            text: "--:--"
            text_font: mono24
            text_color: 0xC9D3F2
        - obj:                   # the sky disc; SKY_BG in sat_tracker.h must match (UI-11)
            id: sky_box
            x: 56
            y: 62                # UI-41i: 4 px lower, room for two alert lines (was 58)
            width: 368
            height: 368
            radius: 184
