                    - lambda: |-
                        const auto &v = sat::form_values;
                        if (!sat::lock_head) id(map_heading).make_call().set_value(v.heading).perform();
                        if (!sat::lock_loc) {  // HW-8: GPS owns the location
                          id(obs_lat).make_call().set_value(v.lat).perform();
                          id(obs_lon).make_call().set_value(v.lon).perform();
                        }
                        if (v.h24) id(clock_24h).turn_on(); else id(clock_24h).turn_off();
                        auto sw = [](lv_obj_t *o, switch_::Switch *e) {  // UI-21/22
                          if (lv_obj_has_state(o, LV_STATE_CHECKED)) e->turn_on(); else e->turn_off();
                        };
                        sw(id(sw_sats), id(show_satellites));
                        sw(id(sw_starlink), id(show_starlink));
                        sw(id(sw_meo), id(show_meo));
                        sw(id(sw_geo), id(show_geo));
                        sw(id(sw_stars), id(show_stars));
                        sw(id(sw_dusk), id(stars_after_dusk));
                        sw(id(sw_trails), id(show_trails));
                        sw(id(sw_miles), id(use_miles));
                        sw(id(sw_debris), id(show_debris));
                        sw(id(sw_planets), id(show_planets));
