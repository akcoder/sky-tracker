select:
  - platform: template           # UI-70: the clock's time zone (Auto = Home Assistant's)
    id: time_zone
    name: Time Zone
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 12
    icon: mdi:earth
    optimistic: true
    restore_value: true
    initial_option: "Alaska"        # the default zone; "Auto (from HA)" takes Home Assistant's
    options:
      - "Auto (from HA)"
      - "Hawaii"
      - "Alaska"
      - "Pacific"
      - "Mountain"
      - "Arizona"
      - "Central"
      - "Eastern"
      - "Atlantic"
      - "Newfoundland"
      - "UTC"
      - "London"
      - "Central Europe"
      - "Eastern Europe"
      - "Moscow"
      - "India"
      - "China"
      - "Japan"
      - "Sydney"
      - "Auckland"
    on_value:
      - lambda: sat::tz::set(i);

number:
  - platform: template           # UI-39: LEO cone, degrees from overhead (the Starlink layer)
    id: leo_cone
    name: LEO Cone
    icon: mdi:angle-acute
    unit_of_measurement: "°"
    min_value: 15
    max_value: 90
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${starlink_radius}
    web_server:
      sorting_group_id: grp_sats
      sorting_weight: 0
    on_value:
      - lambda: sat::set_starlink_radius((int) x);
  - id: !extend backlight_pct    # HW-6: the board package's 1-100 % Backlight number
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 1
  - platform: template           # UI-15: rotate the map from Home Assistant
    id: map_heading
    name: Map Heading
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 3
    icon: mdi:compass-outline
    unit_of_measurement: "°"
    min_value: 0
    max_value: 359
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${map_heading}
    on_value:
      - lambda: |-
          if (!sat::hw::head_edit_allowed(x)) {  // HW-9: the compass owns the heading
            ESP_LOGW("sky_hw", "Map Heading is set by the compass; change ignored");
            id(map_heading).publish_state(sat::hw::head_pub);
            return;
          }
          sat::set_heading(x);

  - platform: template           # UI-16: observer, editable here or on the settings page
    id: obs_lat
    name: Observer Latitude
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 1
    icon: mdi:latitude
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${observer_lat}
    on_value:
      - lambda: |-
          if (sat::hw::gps_locked() && sat::hw::gps.applied && fabs(x - sat::hw::gps.applied_lat) > 1e-6) {
            ESP_LOGW("sky_hw", "Observer Latitude is set by the GPS; change ignored");
            return;  // HW-8: put back by the 1 s interval
          }
          sat::set_observer(id(obs_lat).state, id(obs_lon).state);
  - platform: template
    id: obs_lon
    name: Observer Longitude
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 2
    icon: mdi:longitude
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${observer_lon}
    on_value:
      - lambda: |-
          if (sat::hw::gps_locked() && sat::hw::gps.applied && fabs(x - sat::hw::gps.applied_lon) > 1e-6) {
            ESP_LOGW("sky_hw", "Observer Longitude is set by the GPS; change ignored");
            return;
          }
          sat::set_observer(id(obs_lat).state, id(obs_lon).state);

  - platform: template           # HW-9: added to the compass reading (mounting angle)
    id: compass_offset
    name: Compass Offset
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 4
    icon: mdi:compass-rose
    entity_category: config
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

