button:
  - platform: template           # HW-9
    id: btn_calibrate_compass
    name: Calibrate Compass
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 13
    icon: mdi:compass-outline
    entity_category: config
    on_press:
      - lambda: |-
          if (!sat::hw::compass_present()) {
            sat::show_notice("No compass detected", 8);
            return;
          }
          sat::hw::cal_screen_open(esphome::millis());  // HW-9b: the same guide on the display
  - platform: restart            # diagnostic reboot, in HA and the web UI
    id: btn_reboot
    name: Reboot
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1
    icon: mdi:restart
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: bs_iss_overhead
    name: ISS Overhead
    web_server:
      sorting_group_id: grp_iss
      sorting_weight: 3
    icon: mdi:space-station      # ESPHome sends one icon; per-state icons are set in HA
    lambda: return sat::iss_up();

text_sensor:
  - platform: template           # HW-8
    id: location_source
    name: Location Source
    icon: mdi:crosshairs-gps
    update_interval: never
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 8
  - platform: template           # HW-9
    id: heading_source
    name: Heading Source
    icon: mdi:compass
    update_interval: never
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 9
  - platform: template
    id: ts_next_iss_pass
    name: Next ISS Pass
    web_server:
      sorting_group_id: grp_iss
      sorting_weight: 4
    icon: mdi:calendar-clock
    update_interval: 60s
    lambda: return sat::next_pass_text();
  - platform: template           # UI-54: Launch Library 2
    id: ts_next_launch
    name: Next Launch
    web_server:
      sorting_group_id: grp_sky
      sorting_weight: 18
    icon: mdi:rocket-launch
    update_interval: 300s
    lambda: return sat::next_launch_text();
  - platform: template           # UI-25: the same message as the screen's status line
    id: ts_data_status
    name: Data Status
    icon: mdi:information-outline
    update_interval: 60s
    entity_category: diagnostic
    lambda: return sat::data_status();
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 9
  - platform: template           # FAIL-10: the last crash (reason / PC), kept until the next one
    id: ts_last_crash
    name: Last Crash
    entity_category: diagnostic
    icon: mdi:alert-octagon-outline
    update_interval: 60s
    lambda: return {skydiag::summary()};
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 13
  - platform: template   # "ESPHome 2026.9.0 · Sky Tracker 4.3.5" (replaces the hash/timestamp string)
    id: ts_firmware_version
    name: Firmware Version
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 6h
    lambda: 'return {std::string("ESPHome " ESPHOME_VERSION " \u00b7 Sky Tracker ${fw_version}")};'
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 10
  - platform: wifi_info
    id: ts_wifi_info
    ip_address:
      id: ip_addr                # UI-27: also on the debug page
      name: IP Address
      icon: mdi:ip-network
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 11
    ssid:
      id: wifi_ssid_info         # UI-27: debug page 1
      name: Wi-Fi Network
      icon: mdi:access-point-network
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 12

# ------------------------------------------------------------------ LVGL
lvgl:
  id: lvgl_comp
  displays: main_display
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1000ms    # UI-27: hold the gear 1 s for the debug page
  # PERF-4: 12.5% (57.6 KB) asks for internal RAM first (falls back to PSRAM; the
  # 20 s boot diagnostic logs which). LVGL then blends in SRAM and only the finished
  # pixels cross to the PSRAM framebuffer, which leaves the PSRAM bus to the panel's
  # bounce-buffer refills (their starvation is the vsync shift / garbage lines).
  buffer_size: 12.5%
  log_level: WARN
  bg_color: 0x000000
  text_color: 0xC9D3F2
  text_font: mono16
  top_layer:
    widgets:
      - obj:                     # UI-12
          id: ota_panel
          align: CENTER
          width: 300
          height: 130
          hidden: true
          bg_color: 0x101B3D
          bg_opa: COVER
          border_color: 0xFF8A1F
          border_width: 2
          radius: 12
          scrollable: false
          pad_all: 0
          widgets:
            - label:
                id: ota_title
                align: CENTER            # UI-12: title + progress centred as a pair (measured:
                y: -14                   # ink centre within 0.5 px of the panel centre)
                text: "UPGRADING"
                text_font: mono24
                text_color: 0xFF8A1F
            - label:
                id: ota_pct
                align: CENTER
                y: 18                    # below the title
                text: ""
                text_color: 0xC9D3F2     # the theme default is dark grey: invisible on this panel
                text_font: mono16
  pages:
    - id: wifi_page              # NET-2b: first page, so it is what boots; skipped by page flips
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            align: CENTER
            width: 380
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_row: 6
            widgets:
              - obj:                     # UI-65: the logo, 200 px (sat::logo_show at boot)
                  id: boot_logo
                  width: 200
                  height: 200
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
              - label:
                  id: boot_name
                  text: "Sky Tracker"
                  text_font: setup_title
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
                  pad_top: 10
                  pad_bottom: 8
              - label:
                  id: wifi_title
                  text: "Connecting to Wi-Fi"
                  text_font: setup_body
                  text_color: 0xFFFFFF
                  width: 380
                  text_align: CENTER
              - label:
                  id: wifi_body
                  text: "${wifi_name}"
                  text_font: setup_body
                  text_color: 0xB0B0B0
                  width: 380
                  text_align: CENTER
                  pad_bottom: 18
              - label:               # HW-8/HW-9: which add-on sensors were found
                  id: wifi_hw
                  text: "GPS: checking...\nCompass: checking..."
                  text_font: mono16
                  text_color: 0x7E8BB3
                  width: 380
                  text_align: CENTER
        - label:                     # NET-2b: firmware version, lower right (as on settings)
            align: BOTTOM_RIGHT
            x: -10
            y: -8
            text: "v${fw_version}"
            text_font: mono12
            text_color: 0x5A6687
    - id: sky_page               # UI-1
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      on_click:                  # UI-2: tap anywhere except the gear flips pages
        - if:                    # UI-24: with the details card up, a tap only closes it
            condition:
              lambda: return sat::card_open();
            then:
              - lambda: sat::deselect();
            else:
              - lvgl.page.next:
                  animation: FADE_IN
                  time: 200ms
      widgets:
        - label:
            x: 10
            y: 4
            text: "SKY TRACKER"
            text_font: mono16
            text_color: 0xFF8A1F
        - label:                 # UI-23: observer position, between the title and the clock
            id: hdr_coords
            align: TOP_MID
            y: 4                 # same line as the title
            text: ""
            text_font: mono16
            text_color: 0x7E8BB3
        - label:                 # UI-25 data status / errors (width and wrap set in sat::setup)
            id: hdr_status
            x: 10
            y: 27                # UI-38: 3 px clear of the title (the aurora icon sits above the text)
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
        - label:
            id: hdr_counts
            align: TOP_RIGHT
            x: -10
            y: 31
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
            text_align: RIGHT
        - label:
            id: hdr_clock
            align: TOP_RIGHT
            x: -10
            y: 1                 # digit tops (8 px into a mono24 line) level with the title's capitals (5 px into mono16 at y 4)
            text: "--:--"
            text_font: mono24
            text_color: 0xC9D3F2
        - obj:                   # the sky disc; SKY_BG in sat_tracker.h must match (UI-11)
            id: sky_box
            x: 56
            y: 58
            width: 368
            height: 368
            radius: 184
            bg_color: 0x0B1220   # UI-11: keep in step with SKY_BG (sat_tracker.h)
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false     # taps fall through to the page
        - label:                 # UI-9 footer
            id: foot_iss
            x: 10
            y: 432
            text: ""
            text_font: mono16
        - label:
            id: foot_pass
            x: 10
            y: 454
            text: ""
            text_font: mono16
            text_color: 0xFFD54A
        # UI-20: Sun bottom-left, Moon bottom-right, both outside the sky disc
        - label:
            id: alm_sun
            x: 10
            y: 412
            text: ""
            text_font: mono12
            text_color: 0xFFD54A
        - canvas:                # Moon phase picture, drawn by sat::draw_moon_icon
            id: moon_img
            align: TOP_RIGHT
            x: -10
            y: 360
            width: 32
            height: 32
            transparent: true
        - label:
            id: alm_moon
            align: TOP_RIGHT
            x: -10
            y: 396
            text: ""
            text_font: mono12
            text_color: 0xDCE2EE
            text_align: RIGHT
        - label:
            id: alm_phase
            align: TOP_RIGHT
            x: -10
            y: 412
            text: ""
            text_font: mono12
            text_color: 0x7E8BB3
            text_align: RIGHT
        - button:                # UI-16: settings gear, lower right
            id: gear_btn
            align: BOTTOM_RIGHT
            x: -2
            y: -2
            width: 46
            height: 46
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\uF013"   # LV_SYMBOL_SETTINGS
                  text_font: montserrat_28
                  text_color: 0xB8BEC9
            on_short_click:          # UI-16 (short, so a long press doesn't also open it)
              - if:                  # UI-24: with the details card up, a tap only closes it
                  condition:
                    lambda: return sat::card_open();
                  then:
                    - lambda: sat::deselect();
                  else:
                    - lvgl.page.show: settings_page
            on_long_press:           # UI-27: hold the gear for the debug page
              - lvgl.page.show: debug_page
    - id: debug_page             # UI-27 page 1: system, orbital data, last crash (4.5.18). Close sits top right on both pages; < Prev bottom left, Next > bottom right
      skip: true
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - label:
            x: 8
            y: 12                  # UI-27: the same size as the SKY TRACKER title
