# Sky Tracker — Guition ESP32-4848S040 (requirements rev 4)
# Files: sky-tracker.yaml, sat_net.h (data task: CelesTrak element sets, propagation),
# sat_tracker.h (scheduling + drawing), sky_math.h (geometry, Sun, Moon), sgp4.h
# (SGP4/SDP4), sky_stars.h (star catalogue). Orbits come from CelesTrak: no API key.

substitutions:
  fw_version: "4.6.0"      # project version: HA device info and the settings page (bump on every install)
  name: sky-tracker
  friendly_name: Sky Tracker
  observer_lat: "61.581"     # defaults only; the live values are the Observer Latitude /
  observer_lon: "-149.439"  # Longitude entities, editable on the settings page (UI-16)
  observer_alt_m: "100"
  sat_group: "visual"     # DATA-2: CelesTrak GP group for the satellite layer (~160 brightest)
  starlink_radius: "80"   # DATA-3/UI-39: default LEO cone (radius from overhead; 80 = above 10° elevation); the LEO Cone entity sets it (15-90)
  map_heading: "0"        # UI-15: compass direction at the top of the map (0 = north)
  backlight_min: "0.10"   # HW-6: lowest PWM duty that is still visible; raise if the
                          # panel goes dark at the bottom of the brightness slider
  # HW-8/HW-9: optional GPS and compass (see the wiring diagram)
  gps_rx_pin: "42"        # GPS TX -> GPIO42 (module pin 35); found by the pin scan (RXD0 is
                          # shared with the USB-serial chip, which drowns a GPS out)
  compass_sda: GPIO1      # compass on its own I2C bus (relay-3 pin)
  compass_scl: GPIO2      # (relay-2 pin)
  wifi_name: "your Wi-Fi network"  # shown on the Wi-Fi status page while connecting

esphome:
  name: ${name}
  name_add_mac_suffix: true       # every unit gets its own name
  friendly_name: ${friendly_name}
  project:                       # NET-9: shown in HA's device info
    name: akcoder.sky_tracker
    version: "${fw_version}"
  build_flags:
    # PERF-8: LVGL tracks 32 dirty areas by default and redraws the WHOLE screen when
    # they overflow. Every moving marker dirties two areas, so ~16 moving markers
    # forced a full-screen PSRAM redraw each tick and the panel jumped. ESPHome
    # passes -D flags to every IDF component, LVGL included, so layouts agree.
    - "-DLV_INV_BUF_SIZE=128"
  on_boot:
    - priority: 1100               # HW-7: before the SPI bus (1000) and the panel init
      then:
        - lambda: |-
            sat::panel_soft_reset(39, 48, 47);   // CS, SCK, MOSI of GUITION-4848S040
            // NET-2: fallback AP named "Sky Tracker - XXXX" (last 4 hex digits of the MAC).
            // Set before Wi-Fi starts (setup priority 250); ESPHome's ssid: must be a literal.
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char ssid[33];
            snprintf(ssid, sizeof(ssid), "Sky Tracker - %02X%02X", mac[4], mac[5]);
            auto ap = id(wifi_comp).get_ap();
            ap.set_ssid(ssid);
            id(wifi_comp).set_ap(ap);
    - priority: 600                # NET-10: sun tab icon; before web_server's setup (249)
      then:
        - lambda: |-
            skyweb::install();
            skydiag::install("${fw_version}");  // FAIL-10: before the API takes the crash record
    - priority: -100
      then:
        - lambda: |-
            sat::Config c;
            c.lat = std::isnan(id(obs_lat).state) ? ${observer_lat} : id(obs_lat).state;
            c.lon = std::isnan(id(obs_lon).state) ? ${observer_lon} : id(obs_lon).state;
            c.alt_m = ${observer_alt_m};
            c.sat_group = "${sat_group}";
            c.starlink_radius = std::isnan(id(leo_cone).state) ? ${starlink_radius} : (int) id(leo_cone).state;  // UI-39
            sat::Widgets w;
            w.sky = id(sky_box);
            w.status = id(hdr_status);
            w.counts = id(hdr_counts);
            w.clock = id(hdr_clock);
            w.foot_iss = id(foot_iss);
            w.foot_pass = id(foot_pass);
            w.coords = id(hdr_coords);
            w.alm_sun = id(alm_sun);
            w.alm_moon = id(alm_moon);
            w.alm_phase = id(alm_phase);
            w.moon_img = id(moon_img);
            w.list = id(list_table)->obj;
            w.label_font = id(mono12)->get_lv_font();
            w.title_font = id(mono16)->get_lv_font();
            w.card_font = id(mono14)->get_lv_font();        // UI-24: card body +2 pt
            w.alert_font = id(mono15)->get_lv_font();       // UI-41: alerts, one size
            w.card_title_font = id(mono18)->get_lv_font();  // UI-24: card title +2 pt
            w.icon_font = id(mdi_icon14)->get_lv_font();  // debris trash glyph
            w.card_icon_font = id(mdi_card20)->get_lv_font();  // UI-30: details-card type icon
            w.card_icon_big = id(mdi_card40)->get_lv_font();   // UI-30: the same at 40 px on the card
            sat::sntp_hold();  // NET-8: SNTP waits for Wi-Fi (restarted in wifi on_connect)
            sat::set_heading(id(map_heading).state);  // restored values, applied before drawing
            sat::set_24h(id(clock_24h).state);
            sat::set_miles(id(use_miles).state);
            sat::set_debris(id(show_debris).state);
            sat::set_layers(id(show_satellites).state, id(show_starlink).state, id(show_meo).state, id(show_geo).state);
            sat::set_stars(id(show_stars).state, id(stars_after_dusk).state);
            sat::set_trails(id(show_trails).state);
            sat::set_planets(id(show_planets).state);  // UI-40
            sat::set_milky_way(id(show_milky_way).state);  // UI-64
            sat::set_comets(id(show_comets).state);        // UI-63
            sat::set_alerts(id(aurora_alerts).state, id(planet_alerts).state);  // UI-41a
            sat::set_sky_alerts(id(sky_alerts).state);  // UI-47..51
            sat::set_night(id(night_mode).state);      // UI-45
            sat::setup(c, w);
            sat::night_install();
            sat::settings_bind(id(ta_heading), id(ta_lat), id(ta_lon), id(sw_24h), id(settings_status));
            sat::settings_bind_dms(id(sw_dms), id(box_lat_dd), id(box_lat_dms), id(ta_lat_d), id(ta_lat_m),
                                   id(ta_lat_s), id(lat_hemi), id(box_lon_dd), id(box_lon_dms), id(ta_lon_d),
                                   id(ta_lon_m), id(ta_lon_s), id(lon_hemi));
            sat::settings_set_dms(id(coord_dms));
            // HW-9: compass on its own I2C bus, with its saved calibration
            sat::hw::set_bus(id(bus_b));
            sat::hw::set_calibration(id(cal_cx), id(cal_cy), id(cal_sx), id(cal_sy), id(cal_ok));
            sat::hw::gps_diag.pin = ${gps_rx_pin};  // HW-8a: shown in GPS Diagnostic
            sat::logo_show(id(boot_logo), 200);   // UI-65
            sat::logo_show(id(about_logo), 112);  // UI-67
            {
              char d[24], b[64];
              sat::tidy_date(__DATE__, d, sizeof(d));
              snprintf(b, sizeof(b), "ESPHome %s, built %s", ESPHOME_VERSION, d);
              lv_label_set_text(id(about_built), b);
            }
            sat::sdfw::init("${fw_version}", id(setup_title)->get_lv_font(), id(mono16)->get_lv_font(),
                            id(mono12)->get_lv_font());  // UI-66
            sat::upd::init(id(fw_update), id(setup_title)->get_lv_font(), id(mono16)->get_lv_font(),
                           id(mono12)->get_lv_font());  // UI-68

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # DATA-10: 4 MB "skydata" partition for the orbital-data cache (two 5.75 MB app
  # slots remain). Changing the table needs one USB flash; OTA can't move partitions.
  partitions:
    - name: skydata
      type: data
      subtype: 0x40
      size: 0x400000
  framework:
    type: esp-idf
    advanced:
      # UI-66: firmware from a microSD card. ESPHome leaves these IDF parts out by default.
      include_builtin_idf_components: [fatfs, sdmmc, esp_driver_sdmmc, wear_levelling]
      disable_vfs_support_dir: false   # opendir/readdir on the card
    sdkconfig_options:
      # UI-66: long file names on the card (sky_tracker_firmware_<version>.bin)
      CONFIG_FATFS_LFN_HEAP: y
      CONFIG_FATFS_MAX_LFN: "255"
      # PERF-2: re-sync the RGB panel DMA every vblank so a stall can't leave the
      # picture permanently shifted.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      # PERF-10: run code and read-only data from PSRAM (Espressif's recommendation for
      # a PSRAM framebuffer with bounce buffers). Flash and PSRAM share one bus on the
      # S3: flash instruction fetches starved the panel's refills (jitter), and flash
      # writes stalled the cache entirely (shift during uploads). This replaces the
      # need for CONFIG_LCD_RGB_ISR_IRAM_SAFE, which must still NOT be added (PERF-3).
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      # 64-byte cache lines: fewer, larger PSRAM bursts for the bounce-buffer copies.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # NET-11: a 16 KB TCP receive window (default 5.7 KB): from Alaska the NOAA and NASA
      # servers are ~100 ms away and a download can't run faster than window / round trip.
      # lwIP and Wi-Fi buffers MUST come from PSRAM (PERF-12): in internal RAM (4.5.35) they
      # left ~20 KB free and downloads failed ("Failed to allocate memory").
      CONFIG_LWIP_TCP_WND_DEFAULT: "16384"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "16"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

# BUILD-7: the C++ (headers, sky_extra.cpp, build flags) is the sky_tracker external component
external_components:
  - source:
      type: git
      url: https://github.com/akcoder/sky-tracker
      ref: main
    components: [sky_tracker]
sky_tracker:

psram:
  mode: octal
  speed: 80MHz

# Made for ESPHome: adopt into your own ESPHome Builder from this file, and set up Wi-Fi
# over USB with Improv (https://www.improv-wifi.com) or from the fallback access point.
dashboard_import:
  package_import_url: github://akcoder/sky-tracker/sky-tracker.yaml@main
  import_full_config: true

improv_serial:
  id: improv

logger:
  id: logger_main

api:
  reboot_timeout: 0s             # NET-2: the default 15 min "no HA client" reboot would kill the AP
  max_connections: 8             # HA plus several log viewers; at the default 5 an extra
                                 # viewer was dropped ("dropped immediately after encrypted hello")

ota:
  - platform: http_request         # UI-68: installs what the update entity finds
    id: ota_http
  - platform: esphome
    id: ota_esphome
    on_begin:
      then:
        - lambda: sat::ota_begin();
        - lvgl.page.show: sky_page
        - lambda: |-
            lv_label_set_text(id(ota_title), "UPGRADING");
            lv_label_set_text(id(ota_pct), "starting");
            lv_obj_remove_flag(id(ota_panel), LV_OBJ_FLAG_HIDDEN);
            lv_refr_now(NULL);
    on_progress:
      then:
        - lambda: |-
            static int last = -10;
            int p = (int) x;
            if (p < last + 5 && p < 100) return;
            last = p;
            char b[16];
            snprintf(b, sizeof(b), "%d%%", p);
            lv_label_set_text(id(ota_pct), b);
            lv_refr_now(NULL);
    on_end:
      then:
        - lambda: |-
            lv_label_set_text(id(ota_pct), "rebooting");
            lv_refr_now(NULL);
    on_error:
      then:
        - lambda: |-
            lv_label_set_text(id(ota_title), "UPGRADE FAILED");
            lv_label_set_text(id(ota_pct), "resuming");
            lv_refr_now(NULL);
            sat::ota_error();
        - delay: 5s
        - lambda: lv_obj_add_flag(id(ota_panel), LV_OBJ_FLAG_HIDDEN);

wifi:
  id: wifi_comp
  ap:                            # NET-2: open fallback AP; renamed with the MAC suffix at boot
    ssid: "Sky Tracker"
    ap_timeout: 30s              # NET-2: start the AP 30 s after Wi-Fi fails (default 90 s)
  reboot_timeout: 0s             # never reboot away from the AP while someone is configuring
  on_connect:                    # NET-7: ask for the time as soon as there is a network
    - lambda: sat::sntp_kick();
  on_disconnect:                 # NET-8: no network calls while Wi-Fi is down
    - lambda: sat::sntp_hold();

captive_portal:                  # NET-2: Wi-Fi setup page while the fallback AP is up
  id: portal

web_server:                      # NET-1: built-in web UI on port 80
  port: 80
  version: 3
  local: true                    # bundle the UI so it also works on the AP (no internet)
                                 # NET-1: firmware upload from the web page is ON
  sorting_groups:                # NET-6: sections on the web page (HA is unaffected)
    - id: grp_sky                # order: Location & Sky, Satellites, Celestial, Display, ISS, System
      name: Location & Sky       # (the OTA upload form is always last)
      sorting_weight: 10
    - id: grp_sats
      name: Satellites
      sorting_weight: 20
    - id: grp_celestial            # NET-6: stars, trails, planets (4.5.2)
      name: Celestial
      sorting_weight: 25
    - id: grp_display
      name: Display
      sorting_weight: 30
    - id: grp_iss
      name: ISS
      sorting_weight: 40
    - id: grp_system
      name: System
      sorting_weight: 50

time:
  - platform: sntp
    id: sntp_time
  - platform: homeassistant      # NET-7: second source; sets the clock as soon as HA connects
    id: ha_time

# ARCH-3: issues no requests. It is here because it pulls in esp_http_client,
# esp-tls, the certificate bundle and ArduinoJson for sat_net.h.
http_request:
  id: http_req
  verify_ssl: true
  timeout: 10s

# UI-68: internet updates. GitHub Actions builds every release and publishes the firmware
# and its manifest on GitHub Pages; the device checks every hour and on Settings > Updates.
update:
  - platform: http_request
    id: fw_update
    name: Firmware
    source: https://akcoder.github.io/sky-tracker/manifest.json
    update_interval: 1h
    web_server:
      sorting_group_id: grp_system

# ------------------------------------------------------------------ hardware
spi:
  id: spi_panel
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  - id: bus_a                    # touch (GT911)
    sda: GPIO19
    scl: GPIO45
  - id: bus_b                    # HW-9: optional compass, its own bus (module has pull-ups)
    sda: ${compass_sda}
    scl: ${compass_scl}
    frequency: 100kHz
    scan: false

uart:                            # HW-8: optional GPS, receive only (NMEA, 9600 baud)
  id: gps_uart
  rx_pin:
    number: ${gps_rx_pin}
    mode:
      input: true
      pullup: true               # idle high when no GPS is fitted
  baud_rate: 9600
  rx_buffer_size: 1024

# HW-8: NMEA is read by sat::hw::nmea_feed (interval below), not the gps component,
# so the raw sentences can be shown on the debug page (UI-27).
display:
  - platform: mipi_rgb
    model: GUITION-4848S040      # HW-1/HW-5: pins, timings, 12 MHz pclk from the model
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    transform:                   # HW-1: 180° rotation (model default is true/true)
      mirror_x: false
      mirror_y: false

touchscreen:
  - platform: gt911              # HW-2: no transform; any tap flips the page
    id: touch
    i2c_id: bus_a
    # UI-2: page flipping is an LVGL on_click on each page, so the gear button
    # (UI-16) can take its own taps.

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    frequency: 1000Hz
    min_power: ${backlight_min}  # HW-6: 1% brightness = this duty, never darker
    zero_means_zero: true        # only an explicit OFF turns the backlight off

light:
  - platform: monochromatic     # HW-3
    id: backlight
    name: Backlight Light
    internal: true               # HA and the web UI get the 1-100 % "Backlight" number instead
    output: backlight_pwm
    restore_mode: RESTORE_AND_ON # HW-3: always boots on, keeps the brightness
    default_transition_length: 250ms
    on_state:                    # keep the settings slider in step with HA / web changes
      - lambda: |-
          const float pct = roundf(id(backlight).remote_values.get_brightness() * 100.0f);
          lv_obj_t *s = id(sl_bright);   // null until LVGL is set up (the light restores first)
          if (s != nullptr && (int) pct != lv_slider_get_value(s))
            lv_slider_set_value(s, (int) pct, LV_ANIM_OFF);
          if (pct >= 1 && id(backlight_pct).state != pct)
            id(backlight_pct).publish_state(pct);

font:
  - file: "gfonts://Roboto Mono"
    id: mono12
    size: 12
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: &glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz|°"
  - file: "gfonts://Roboto Mono"
    id: mono16
    size: 16
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono14                   # UI-24: details card body (2 pt over mono12)
    size: 14
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono15                   # UI-41: status-line alerts (1 pt over mono14)
    size: 15
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono"
    id: mono18                   # UI-24: details card title (2 pt over mono16)
    size: 18
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: *glyphs
  - file: "gfonts://Roboto Mono@500"
    id: mono24
    size: 24
    bpp: 4                       # anti-aliased (ESPHome default is 1: jagged edges)
    glyphs: " -0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ"  # clock ("--:--" before time sync), AM/PM, OTA panel title
  # NET-2b Wi-Fi status page: Roboto Light 34 (name, firmware prompt titles), Roboto 22
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_icon14
    size: 14
    bpp: 4
    # trash-can (debris on the map) plus the UI-30 list icons: space-station,
    # satellite-uplink, satellite-variant, earth, crosshairs-gps, weather-sunny, moon-waning-crescent, orbit (UI-40b planets)
    glyphs: ["\U000F0A79", "\U000F1383", "\U000F0909", "\U000F0471", "\U000F01E7", "\U000F01A4", "\U000F0599", "\U000F0F65", "\U000F0018", "\U000F14DE", "\U000F0629"]  # + rocket-launch (UI-54 list), meteor (UI-63 comets)
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_card20
    size: 20
    bpp: 4
    # UI-30 details-card icons: space-station, satellite-uplink, satellite-variant,
    # earth, crosshairs-gps, trash-can; weather-sunny (UI-36 Sun card); aurora (UI-38 notice);
    # monitor, map-marker, weather-night (UI-16a settings tabs); star-shooting, star-four-points,
    # weather-sunset-down (UI-33 Sat Trails, Stars, After dusk)
    # moon-full (UI-48/49 alerts, 4.5.15)
    glyphs: ["\U000F1383", "\U000F0909", "\U000F0471", "\U000F01E7", "\U000F01A4", "\U000F0A79", "\U000F0599", "\U000F1BB9", "\U000F0379", "\U000F034E", "\U000F0594", "\U000F1741", "\U000F0AE2", "\U000F059B", "\U000F0F62", "\U000F018C", "\U000F14DE", "\U000F0629", "\U000F00B8", "\U000F0150", "\U000F00DF", "\U000F00E1", "\U000F08F0", "\U000F0F57", "\U000F0F5A", "\U000F1382"]  # moon-full, compass-outline, rocket-launch, meteor (UI-63), blur-radial (UI-64); settings row icons (UI-16a, 4.5.38): clock-outline, brightness-6, brightness-auto, map-marker-distance; latitude, longitude, compass-rose
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_card40
    size: 40
    bpp: 4
    # UI-30 (4.5.5): details-card icons at the Moon picture's size: space-station, satellite-uplink,
    # satellite-variant, earth, crosshairs-gps, trash-can, weather-sunny, star-four-points
    glyphs: ["\U000F1383", "\U000F0909", "\U000F0471", "\U000F01E7", "\U000F01A4", "\U000F0A79", "\U000F0599", "\U000F0AE2", "\U000F1741", "\U000F0629"]  # + star-shooting (UI-47 shower card), meteor (UI-63 comet card)
  - file: "gfonts://Roboto@300"
    id: setup_title
    size: 34
    bpp: 4
    glyphs: &ascii " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  - file: "gfonts://Roboto"
    id: setup_body
    size: 22
    bpp: 4
    glyphs: *ascii

globals:
  - id: bright_on_open           # UI-16: brightness when settings opened (Cancel restores it)
    type: float
    initial_value: "1.0"
  - id: bright_day               # UI-44: daytime brightness for Auto Brightness (0..1)
    type: float
    restore_value: true
    initial_value: "0.8"
  - id: bright_day_open          # UI-44: bright_day when settings opened (Cancel restores it)
    type: float
    initial_value: "0.8"
  - id: coord_dms                # UI-16: coordinate entry format (false = decimal, true = DMS)
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cal_cx                   # HW-9: compass calibration (hard-iron centre, soft-iron scale)
    type: float
    restore_value: true
    initial_value: "0"
  - id: cal_cy
    type: float
    restore_value: true
    initial_value: "0"
  - id: cal_sx
    type: float
    restore_value: true
    initial_value: "1"
  - id: cal_sy
    type: float
    restore_value: true
    initial_value: "1"
  - id: cal_ok
    type: bool
    restore_value: true
    initial_value: "false"

interval:
  - interval: 200ms              # HW-9: compass at 5 Hz
    id: interval_1
    then:
      - lambda: |-
          if (sat::hw::compass_poll(esphome::millis())) {  // a calibration run just ended
            auto c = sat::hw::calibrate_finish();
            if (c.valid) {
              id(cal_cx) = c.cx; id(cal_cy) = c.cy; id(cal_sx) = c.sx; id(cal_sy) = c.sy; id(cal_ok) = true;
              sat::show_notice("Compass calibrated", 8);
            } else {
              sat::show_notice("Compass calibration failed: turn the display a full circle", 12);
            }
            sat::hw::cal_screen_result(c.valid);  // HW-9b
          }
          sat::hw::cal_screen_update(esphome::millis());
          if (sat::finder_open()) {  // UI-57: the arrow follows the compass at 5 Hz
            const float mag = sat::hw::magnetic_heading(id(compass_reverse).state);
            sat::finder_update(std::isnan(mag) ? NAN
                               : sat::hw::wrap360(mag + sat::declination() + id(compass_offset).state));
          }
  - interval: 30s                # UI-44: auto brightness follows the Sun
    id: interval_2
    then:
      - lambda: |-
          if (!id(auto_bright).state || id(settings_page)->is_showing() || !id(backlight).current_values.is_on()) return;
          const float want = std::max(0.01f, id(bright_day) * sat::auto_bright_factor());
          if (fabsf(id(backlight).current_values.get_brightness() - want) < 0.01f) return;
          auto call = id(backlight).turn_on();
          call.set_brightness(want);
          call.set_transition_length(3000);
          call.perform();
  - interval: 5s                 # UI-66: look for a microSD card with firmware on it
    id: interval_3
    then:
      - lambda: sat::sdfw::tick(esphome::millis());
  - interval: 1s                 # UI-27: debug pages, only while one is showing
    id: interval_4
    then:
      - lambda: |-
          if (id(debug_page)->is_showing()) {  // page 1: system, orbital data, last crash
            static char b[1800];
            const uint32_t s = esphome::millis() / 1000;
            char up[24];
            sat::fmt_dur((double) s, up, sizeof(up));  // UI-17a
            const std::string ip = id(ip_addr).state, ssid = id(wifi_ssid_info).state;
            int k = snprintf(b, sizeof(b),
                             "SYSTEM\n  IP %s\n  Wi-Fi %s  %d dBm\n  Firmware %s  ESPHome %s\n"
                             "  Up %s  RAM %u kB  PSRAM %u kB free\n",
                             ip.empty() ? "-" : ip.c_str(), ssid.empty() ? "-" : ssid.c_str(),
                             (int) id(wifi_comp).wifi_rssi(), "${fw_version}", ESPHOME_VERSION,
                             up,
                             (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                             (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
            char orb[400];  // UI-27: age of the orbital data
            sat::orbital_debug(orb, sizeof(orb), sat::clock_now());
            char diag[600];  // FAIL-10: reset reason and the last crash
            skydiag::debug_text(diag, sizeof(diag));
            if (k < (int) sizeof(b)) snprintf(b + k, sizeof(b) - k, "%s\n%s", orb, diag);
            lv_label_set_text(id(debug_label), b);
          } else if (id(about_page)->is_showing()) {  // UI-67
            static char b[200];
            const std::string ip = id(ip_addr).state, ssid = id(wifi_ssid_info).state;
            sat::about_device_text(b, sizeof(b), App.get_name().c_str(), ip.c_str(), ssid.c_str(),
                                   (int) id(wifi_comp).wifi_rssi(), get_mac_address_pretty().c_str(),
                                   esphome::millis() / 1000.0);
            if (strcmp(lv_label_get_text(id(about_dev)), b) != 0) lv_label_set_text(id(about_dev), b);
          } else if (id(debug2_page)->is_showing()) {  // page 2: GPS and compass
            static char b[1400];
            sat::hw::debug_text(b, sizeof(b), esphome::millis(), 2);  // the 2 newest NMEA lines
            lv_label_set_text(id(debug2_label), b);
            const bool can = sat::hw::compass_present();  // HW-9b: no compass, no button
            if (can == lv_obj_has_state(id(btn_dbg_cal), LV_STATE_DISABLED)) {
              if (can) lv_obj_remove_state(id(btn_dbg_cal), LV_STATE_DISABLED);
              else lv_obj_add_state(id(btn_dbg_cal), LV_STATE_DISABLED);
              lv_obj_set_style_text_color(id(lbl_btn_dbg_cal), lv_color_hex(can ? 0xEEF2FF : 0x4A5577), 0);
            }
          }
  - interval: 50ms               # HW-8: drain the GPS UART into the NMEA reader
    id: interval_5
    then:
      - lambda: |-
          const uint32_t now = esphome::millis();
          uint8_t c;
          int n = 0;
          while (n++ < 512 && id(gps_uart).available() && id(gps_uart).read_byte(&c))
            sat::hw::nmea_feed(c, now);
  - interval: 1s                 # HW-8/HW-9: GPS location and compass heading
    id: interval_6
    then:
      - lambda: |-
          // ---- GPS
          const auto &m = sat::hw::nmea;
          const bool valid = sat::hw::nmea_fix_ok(esphome::millis());
          sat::hw::gps_update(esphome::millis(), m.chars, valid, m.lat, m.lon, m.alt, m.sats_used < 0 ? 0 : m.sats_used);
          {  // HW-8 diagnostics: bytes, checksums; steps the baud rate if needed
            const uint32_t nb = sat::hw::gps_diag_tick(esphome::millis(), m.chars, m.passed, m.failed);
            if (nb) {
              id(gps_uart).set_baud_rate(nb);
              id(gps_uart).load_settings(false);
            }
            static uint8_t n = 0;
            if (++n % 5 == 0) {
              char d[128];
              sat::hw::gps_diag_text(d, sizeof(d));
              if (n % 10 == 0) ESP_LOGI("sky_hw", "GPS diag: %s", d);
            }
          }
          double lat, lon;
          if (sat::hw::gps_new_position(id(obs_lat).state, id(obs_lon).state, lat, lon)) {
            id(obs_lat).make_call().set_value(lat).perform();   // saved, so a reboot starts here
            id(obs_lon).make_call().set_value(lon).perform();
          } else if (sat::hw::gps_locked() && sat::hw::gps.applied) {
            // undo edits made from HA or the web page while the GPS owns the location
            if (fabs(id(obs_lat).state - sat::hw::gps.applied_lat) > 1e-6) id(obs_lat).publish_state(sat::hw::gps.applied_lat);
            if (fabs(id(obs_lon).state - sat::hw::gps.applied_lon) > 1e-6) id(obs_lon).publish_state(sat::hw::gps.applied_lon);
          }
          // ---- compass
          const float mag = sat::hw::magnetic_heading(id(compass_reverse).state);
          if (!std::isnan(mag)) {
            // HW-9a: declination from the location (WMM2025), not a fixed setting
            const float h = sat::hw::wrap360(mag + sat::declination() + id(compass_offset).state);
            const float cur = id(map_heading).state;
            if (std::isnan(sat::hw::head_pub) || std::isnan(cur) || fabsf(sat::hw::angle_diff(h, cur)) >= 1.0f) {
              sat::hw::head_pub = roundf(h) >= 360 ? 0 : roundf(h);
              id(map_heading).publish_state(sat::hw::head_pub);   // not saved: no flash wear
            }
          }
          if (sat::hw::compass_calibrating()) {
            char b[120];
            const int left = (int) ((int32_t) (sat::hw::compass.cal_end_ms - esphome::millis()) / 1000);
            char ls[16];
            sat::fmt_dur(left > 0 ? left : 0, ls, sizeof(ls));  // UI-17a
            snprintf(b, sizeof(b), "Compass calibration: turn the display slowly\nthrough a full circle (%s)", ls);
            sat::show_notice(b, 3);
          }
          {  // HW-9a: the settings button shows the run and the result
            char lb[24], st[24];
            if (sat::hw::compass_calibrating()) {
              const int left = (int) ((int32_t) (sat::hw::compass.cal_end_ms - esphome::millis()) / 1000);
              char ls[16];
              sat::fmt_dur(left > 0 ? left : 0, ls, sizeof(ls));  // UI-17a
              snprintf(lb, sizeof(lb), "Turn... %s", ls);
              snprintf(st, sizeof(st), "%s", "turn slowly");
            } else {
              snprintf(lb, sizeof(lb), "%s", "Calibrate");
              snprintf(st, sizeof(st), "%s", !sat::hw::compass_present() ? "no compass"
                                             : sat::hw::compass_calibrated() ? "calibrated" : "not calibrated");
            }
            if (strcmp(lv_label_get_text(id(lbl_cal)), lb) != 0) lv_label_set_text(id(lbl_cal), lb);
            if (strcmp(lv_label_get_text(id(lbl_cal_state)), st) != 0) lv_label_set_text(id(lbl_cal_state), st);
            const bool can = sat::hw::compass_present();  // HW-9b: no compass, no button
            if (can == lv_obj_has_state(id(btn_cal), LV_STATE_DISABLED)) {
              if (can) lv_obj_remove_state(id(btn_cal), LV_STATE_DISABLED);
              else lv_obj_add_state(id(btn_cal), LV_STATE_DISABLED);
              lv_obj_set_style_text_color(id(lbl_cal), lv_color_hex(can ? 0xEEF2FF : 0x4A5577), 0);
            }
          }
          sat::set_locks(sat::hw::gps_locked(), sat::hw::heading_locked());
          // ---- boot / Wi-Fi status page: say which add-ons are connected
          if (id(wifi_page)->is_showing()) {
            char hw[96], g[48], c[48];
            const auto &gs = sat::hw::gps;
            if (gs.state == sat::hw::GPS_FIX)
              snprintf(g, sizeof(g), "GPS: connected, fix (%d sat)", gs.sats);
            else if (gs.state == sat::hw::GPS_SEARCHING)
              snprintf(g, sizeof(g), "GPS: connected, searching");
            else
              snprintf(g, sizeof(g), "GPS: not connected");
            if (sat::hw::compass_present())
              snprintf(c, sizeof(c), "Compass: connected (%s)", sat::hw::compass_chip());
            else
              snprintf(c, sizeof(c), "Compass: not connected");
            snprintf(hw, sizeof(hw), "%s\n%s", g, c);
            if (strcmp(lv_label_get_text(id(wifi_hw)), hw) != 0) lv_label_set_text(id(wifi_hw), hw);
          }
          // ---- HA text
          char src[48];
          if (sat::hw::gps_locked())
            snprintf(src, sizeof(src), "GPS (%d satellites)", sat::hw::gps.sats);
          else if (sat::hw::gps.state != sat::hw::GPS_ABSENT)
            snprintf(src, sizeof(src), "Manual; GPS searching (%d satellites)", sat::hw::gps.sats);
          else
            snprintf(src, sizeof(src), "Manual");
          if (id(location_source).state != src) id(location_source).publish_state(src);
          if (sat::hw::heading_locked())
            snprintf(src, sizeof(src), "Compass (%s%s)", sat::hw::compass_chip(), sat::hw::compass_calibrated() ? "" : ", not calibrated");
          else
            snprintf(src, sizeof(src), "Manual");
          if (id(heading_source).state != src) id(heading_source).publish_state(src);
  - interval: 2s                 # motion tick (MOTION-7), drain, HUD
    id: interval_7
    then:
      - lambda: sat::tick();
      - lambda: |-
          // NET-2b: Wi-Fi status page (layout modelled on espcontrol's boot screen).
          // The map is not shown until Wi-Fi connects; after that, 10 s without Wi-Fi
          // brings the status page back (never over the settings page).
          static uint32_t lost_since = 0;
          static int state = -1;  // 0 connected, 1 connecting, 2 fallback AP up
          const uint32_t now = esphome::millis();
          int st;
          if (id(wifi_comp).is_connected()) {
            st = 0;
            lost_since = 0;
          } else {
            if (lost_since == 0)
              lost_since = now | 1;
            st = id(wifi_comp).is_ap_active() ? 2 : 1;
          }
          const bool on_status = id(wifi_page)->is_showing();
          if (st == 0) {
            if (on_status)
              id(lvgl_comp)->show_page(id(sky_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300);
          } else {
            if (st != state) {
              if (st == 1) {
                lv_label_set_text(id(wifi_title), "Connecting to Wi-Fi");
                lv_label_set_text(id(wifi_body), "${wifi_name}");
              } else {
                auto ap = id(wifi_comp).get_ap();
                char b[128];
                snprintf(b, sizeof(b), "Join '%.*s'\nfrom your phone", (int) ap.get_ssid().size(), ap.get_ssid().c_str());
                lv_label_set_text(id(wifi_title), "Set up Wi-Fi");
                lv_label_set_text(id(wifi_body), b);
              }
            }
            if (!on_status && now - lost_since > 10000 && !id(settings_page)->is_showing())
              id(lvgl_comp)->show_page(id(wifi_page)->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300);
          }
          state = st;

