    lambda: return sat::next_launch_text();
  - platform: template           # UI-25: the same message as the screen's status line
    id: ts_data_status
    name: Data Status
    icon: mdi:information-outline
    update_interval: 60s
    entity_category: diagnostic
    lambda: return sat::data_status();
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 9
  - platform: template           # FAIL-10: the last crash (reason / PC), kept until the next one
    id: ts_last_crash
    name: Last Crash
    entity_category: diagnostic
    icon: mdi:alert-octagon-outline
    update_interval: 60s
    lambda: |-
      // FAIL-10a: "4.6.29, Oct 8 07:58: Abort / ..."; the record is stamped once the clock is set
      skydiag::stamp(sat::clock_now(), esphome::millis() / 1000.0);
      char w[32] = "";
      if (const int64_t t = skydiag::when(); t > 0) {
        char md[16], hm[12];
        sat::local_md((double) t, md, sizeof(md));
        sat::local_hm(t, hm, sizeof(hm));
        snprintf(w, sizeof(w), "%s %s", md, hm);
      }
      return {skydiag::summary(w)};
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 13
  - platform: template   # "ESPHome 2026.9.0 · Sky Tracker 4.3.5" (replaces the hash/timestamp string)
